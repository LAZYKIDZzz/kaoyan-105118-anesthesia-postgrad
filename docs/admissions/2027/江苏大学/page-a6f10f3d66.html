<script>
    // 全局拦截快捷键（父页面一层防护，解决快捷键穿透iframe）
    document.addEventListener('keydown', function (e) {
        const key = e.key.toLowerCase();
        const ctrl = e.ctrlKey || e.metaKey;
        if (e.key === 'F12' || (ctrl && ['s', 'p', 'u'].includes(key))) {
            e.preventDefault();
            e.stopImmediatePropagation();
        }
    }, true);
    document.addEventListener('contextmenu', e => e.preventDefault());

    // 遍历页面所有iframe，自动处理
    const allIframes = document.querySelectorAll('iframe');
    allIframes.forEach(iframe => {
        iframe.onload = function () {
            const innerDoc = this.contentDocument || this.contentWindow.document;
            // 1. 注入样式：隐藏下载打印按钮、禁止复制、打印空白
            const styleTag = innerDoc.createElement('style');
            styleTag.textContent = `
            #download, #print { display: none !important; }
            @media print { body * { display: none !important; } }
            html, body { user-select: none; -webkit-user-select: none; }
            canvas, img { pointer-events: none; }
        `;
            innerDoc.head.appendChild(styleTag);

            // 2. 给iframe内部注入快捷键拦截脚本（双层锁Ctrl+S/P）
            const scriptTag = innerDoc.createElement('script');
            scriptTag.textContent = `
            document.addEventListener('keydown', function(e) {
                const key = e.key.toLowerCase();
                const ctrl = e.ctrlKey || e.metaKey;
                if (e.key === 'F12' || (ctrl && ['s','p','u'].includes(key))) {
                    e.preventDefault();
                    e.stopImmediatePropagation();
                }
            }, true);
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('dragstart', e => e.preventDefault());
        `;
            innerDoc.body.appendChild(scriptTag);
        }
    })
</script>
