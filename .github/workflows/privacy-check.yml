name: Check for private local paths

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test privacy checks
        run: python3 -m unittest discover -s tests -p 'test_private_paths.py'
      - name: Scan tracked files and reachable history
        run: python3 scripts/check_private_paths.py --history
